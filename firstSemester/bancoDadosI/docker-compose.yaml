version: '3'

services:
  db:
    image: postgres
    restart: always
    volumes:
     # Alterado de /var/lib/postgresql/data para /var/lib/postgresql
     # User default é postgres
     - pgdata:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: "1234"
    ports:
      - 5432:5432

volumes:
  pgdata: